name: Publish GitHub Pages

# Deployment is explicit, never triggered by uploading or pushing the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare browser files and synthetic testing data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/examples
          cp index.html styles.css core.js work-ui.js work-report.js insights.js matrix.js elt-report.js app.js data.js storage.js favicon.ico LICENSE-ATTACK.txt _site/
          cp examples/operations-showcase-workspace.json _site/examples/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
